[project]
name = "dwsim-mcp-server"
version = "0.1.0"
description = "Model Context Protocol server for DWSIM chemical process simulation"
authors = [{name = "OntoLedgy AI", email = "development@ontoledgy.ai"}]
requires-python = ">=3.11,<3.13"
dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.0,<3",
    "pydantic-settings>=2.0,<3",
    "structlog>=24.1.0",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp-proto-http>=1.20.0",
    "prometheus-client>=0.19.0",
    "psutil>=5.9.0",
    "pythonnet>=3.0.0",
    "jsonrpcclient>=4.0.0",
    "jsonrpcserver>=5.0.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "jinja2>=3.1.0",
    "aiofiles>=24.1.0",
    "aiohttp>=3.9.0",
    "httpx>=0.27.0",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "scipy>=1.17.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "black>=24.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]
observability = [
    "opentelemetry-exporter-zipkin>=1.20.0",
]
http = [
    "uvicorn>=0.30.0",
    "starlette>=0.37.0",
]

[project.scripts]
dwsim-mcp = "dwsim_mcp_server.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dwsim_mcp_server"]

[tool.hatch.build.targets.sdist]
include = [
    "dwsim_mcp_server/",
    "prebuilt/",
]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=dwsim_mcp_server --cov-report=html --cov-report=term"
cache_dir = "%TEMP%\\pytest-cache"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: marks integration tests that may require DWSIM worker/interop",
]
