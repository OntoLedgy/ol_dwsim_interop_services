[tool.poetry]
name = "dwsim-mcp-server"
version = "0.1.0"
description = "Model Context Protocol server for DWSIM chemical process simulation"
authors = ["OntoLedgy AI <development@ontoledgy.ai>"]
license = "GPLv3"
readme = "README.md"
packages = [{include = "dwsim_mcp_server"}]

[tool.poetry.dependencies]
python = "^3.10"
mcp = "^0.1.0"
pydantic = "^2.0.0"
pydantic-settings = "^2.0.0"
structlog = "^24.0.0"
opentelemetry-api = "^1.20.0"
opentelemetry-sdk = "^1.20.0"
pythonnet = {version = "^3.0.0", optional = true}
jsonrpcclient = "^4.0.0"
jsonrpcserver = "^5.0.0"
typer = "^0.9.0"
rich = "^13.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-asyncio = "^0.21.0"
pytest-cov = "^4.1.0"
black = "^23.0.0"
ruff = "^0.1.0"
mypy = "^1.5.0"

[tool.poetry.extras]
pythonnet = ["pythonnet"]

[tool.poetry.scripts]
dwsim-mcp = "dwsim_mcp_server.server:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=dwsim_mcp_server --cov-report=html --cov-report=term"
