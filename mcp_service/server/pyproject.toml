[tool.poetry]
name = "dwsim-mcp-server"
version = "0.1.0"
description = "Model Context Protocol server for DWSIM chemical process simulation"
authors = ["OntoLedgy AI <development@ontoledgy.ai>"]
license = "GPLv3"
readme = "README.md"
packages = [{include = "dwsim_mcp_server"}]

[project]
name = "dwsim-mcp-server"
version = "0.1.0"
description = "Model Context Protocol server for DWSIM chemical process simulation"
authors = [{name = "OntoLedgy AI", email = "development@ontoledgy.ai"}]
requires-python = ">=3.11,<3.13"
dependencies = [
    "mcp>=0.1.0",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "structlog>=24",
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "psutil>=5.9",
    "pythonnet>=3.0.0",
    "jsonrpcclient>=4",
    "jsonrpcserver>=5",
    "typer>=0.9",
    "rich>=13",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "scipy>=1.17.0",
    "aiofiles>=24.1.0",
    "pytest-asyncio>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4",
    "black>=23",
    "ruff>=0.1",
    "mypy>=1.5",
]

[project.scripts]
dwsim-mcp = "dwsim_mcp_server.server:run"

[tool.poetry.scripts]
dwsim-mcp = "dwsim_mcp_server.server:run"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=dwsim_mcp_server --cov-report=html --cov-report=term"
cache_dir = "%TEMP%\\pytest-cache"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: marks integration tests that may require DWSIM worker/interop",
]
