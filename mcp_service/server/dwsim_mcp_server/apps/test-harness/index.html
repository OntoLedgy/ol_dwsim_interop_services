<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DWSIM MCP App Test Harness</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4f1ec;
        --panel: #ffffff;
        --text: #1c2127;
        --muted: #5c6874;
        --border: #d8cfc4;
        --accent: #c5612f;
        --accent-soft: rgba(197, 97, 47, 0.14);
        font-family: "Space Grotesk", "Avenir Next", "Segoe UI", sans-serif;
      }

      html[data-theme="dark"] {
        color-scheme: dark;
        --bg: #121518;
        --panel: #1d2126;
        --text: #f4f5f7;
        --muted: #a1aab4;
        --border: #2c3238;
        --accent: #f39a67;
        --accent-soft: rgba(243, 154, 103, 0.18);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
      }

      .layout {
        display: grid;
        grid-template-columns: 280px 1fr;
        min-height: 100vh;
      }

      .panel {
        padding: 20px;
        border-right: 1px solid var(--border);
        background: var(--panel);
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .panel h1 {
        font-size: 1.2rem;
        margin: 0;
      }

      .panel p {
        color: var(--muted);
        margin: 0;
        font-size: 0.9rem;
      }

      .control-group {
        display: grid;
        gap: 8px;
      }

      label {
        font-size: 0.85rem;
        color: var(--muted);
      }

      select,
      button {
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 8px 10px;
        background: var(--panel);
        color: var(--text);
        font-size: 0.9rem;
      }

      button {
        cursor: pointer;
        background: var(--accent);
        color: #fff;
        border: none;
        font-weight: 600;
      }

      button.secondary {
        background: transparent;
        color: var(--text);
        border: 1px solid var(--border);
      }

      .iframe-wrap {
        padding: 20px;
      }

      iframe {
        width: 100%;
        height: calc(100vh - 40px);
        border: 1px solid var(--border);
        border-radius: 16px;
        background: #fff;
      }

      .log {
        background: #0f1215;
        color: #d8dee4;
        border-radius: 10px;
        padding: 10px;
        font-family: "JetBrains Mono", "Consolas", monospace;
        font-size: 0.75rem;
        height: 160px;
        overflow-y: auto;
      }

      @media (max-width: 900px) {
        .layout {
          grid-template-columns: 1fr;
        }

        .panel {
          border-right: none;
          border-bottom: 1px solid var(--border);
        }

        iframe {
          height: 70vh;
        }
      }
    </style>
  </head>
  <body>
    <div class="layout">
      <aside class="panel">
        <h1>DWSIM MCP App Harness</h1>
        <p>Load an app in the iframe and send mock tool results.</p>

        <div class="control-group">
          <label for="app-select">App</label>
          <select id="app-select">
            <option value="simulation-results">simulation-results</option>
            <option value="stream-properties">stream-properties</option>
            <option value="flowsheet-viewer">flowsheet-viewer</option>
            <option value="sensitivity-analysis">sensitivity-analysis</option>
            <option value="diagnostics">diagnostics</option>
          </select>
          <button id="load-app">Load App</button>
        </div>

        <div class="control-group">
          <label for="mock-select">Mock Data</label>
          <select id="mock-select">
            <option value="simulation-result-converged.json">simulation-result-converged</option>
            <option value="simulation-result-failed.json">simulation-result-failed</option>
            <option value="stream-properties.json">stream-properties</option>
            <option value="flowsheet-topology.json">flowsheet-topology</option>
            <option value="sensitivity-2d.json">sensitivity-2d (multi-output)</option>
            <option value="sensitivity-3d.json">sensitivity-3d (surface)</option>
            <option value="diagnostics.json">diagnostics</option>
          </select>
          <button id="send-mock">Send Tool Result</button>
          <label style="display:flex;align-items:center;gap:6px;margin-top:6px;">
            <input type="checkbox" id="auto-send" checked />
            Auto-send on app load
          </label>
        </div>

        <div class="control-group">
          <label>Theme</label>
          <button id="toggle-theme" class="secondary">Toggle Theme</button>
        </div>

        <div class="control-group">
          <label>Message Log</label>
          <div id="log" class="log"></div>
        </div>
      </aside>

      <section class="iframe-wrap">
        <iframe id="app-frame" title="MCP App Preview"></iframe>
      </section>
    </div>

          var entry = document.createElement("div");
          entry.textContent = "[" + new Date().toLocaleTimeString() + "] " + prefix + ": " + message;
          log.appendChild(entry);
          log.scrollTop = log.scrollHeight;

          "sensitivity-analysis": "sensitivity-2d.json",

        function loadApp() {
          var appName = appSelect.value;
          iframe.src = "../templates/" + appName + "/index.html";
          appendLog("SYSTEM", "Loaded app " + appName);

          // Auto-select matching mock data
          var defaultMock = APP_TO_MOCK[appName];
          if (defaultMock && mockSelect.querySelector('option[value="' + defaultMock + '"]')) {
            mockSelect.value = defaultMock;
            appendLog("SYSTEM", "Auto-selected mock: " + defaultMock);
          }

          // Auto-send data after iframe loads
          var autoSend = document.getElementById("auto-send");
          if (autoSend && autoSend.checked) {
            iframe.onload = function () {
              setTimeout(function () {
                sendMock();
              }, 300); // Small delay to ensure app JS is initialized
            };
          }

        function sendMock() {
          var fileName = mockSelect.value;
          var data = MOCK_DATA[fileName];
          if (!data) {
            appendLog("ERROR", "Mock data not found: " + fileName);
            return;
          }
          if (!iframe.contentWindow) {
            appendLog("ERROR", "Iframe not ready - click Load App first");
            return;
          }
          bridge.sendToolResult({
            content: [{ type: "text", text: "Mock tool result" }],
            structuredContent: data,
          });
          appendLog("SYSTEM", "Sent mock data " + fileName + " (keys: " + Object.keys(data).join(", ") + ")");
