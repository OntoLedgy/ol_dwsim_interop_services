<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DWSIM MCP App Test Harness</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4f1ec;
        --panel: #ffffff;
        --text: #1c2127;
        --muted: #5c6874;
        --border: #d8cfc4;
        --accent: #c5612f;
        --accent-soft: rgba(197, 97, 47, 0.14);
        font-family: "Space Grotesk", "Avenir Next", "Segoe UI", sans-serif;
      }

      html[data-theme="dark"] {
        color-scheme: dark;
        --bg: #121518;
        --panel: #1d2126;
        --text: #f4f5f7;
        --muted: #a1aab4;
        --border: #2c3238;
        --accent: #f39a67;
        --accent-soft: rgba(243, 154, 103, 0.18);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
      }

      .layout {
        display: grid;
        grid-template-columns: 280px 1fr;
        min-height: 100vh;
      }

      .panel {
        padding: 20px;
        border-right: 1px solid var(--border);
        background: var(--panel);
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .panel h1 {
        font-size: 1.2rem;
        margin: 0;
      }

      .panel p {
        color: var(--muted);
        margin: 0;
        font-size: 0.9rem;
      }

      .control-group {
        display: grid;
        gap: 8px;
      }

      label {
        font-size: 0.85rem;
        color: var(--muted);
      }

      select,
      button {
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 8px 10px;
        background: var(--panel);
        color: var(--text);
        font-size: 0.9rem;
      }

      button {
        cursor: pointer;
        background: var(--accent);
        color: #fff;
        border: none;
        font-weight: 600;
      }

      button.secondary {
        background: transparent;
        color: var(--text);
        border: 1px solid var(--border);
      }

      .iframe-wrap {
        padding: 20px;
      }

      iframe {
        width: 100%;
        height: calc(100vh - 40px);
        border: 1px solid var(--border);
        border-radius: 16px;
        background: #fff;
      }

      .log {
        background: #0f1215;
        color: #d8dee4;
        border-radius: 10px;
        padding: 10px;
        font-family: "JetBrains Mono", "Consolas", monospace;
        font-size: 0.75rem;
        height: 160px;
        overflow-y: auto;
      }

      .divider {
        border-top: 1px solid var(--border);
        margin: 8px 0;
      }

      .mode-tabs {
        display: flex;
        gap: 4px;
        margin-bottom: 12px;
      }

      .mode-tab {
        flex: 1;
        padding: 6px 8px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--panel);
        color: var(--muted);
        cursor: pointer;
        font-size: 0.8rem;
        font-weight: 500;
        text-align: center;
      }

      .mode-tab.active {
        background: var(--accent);
        color: #fff;
        border-color: var(--accent);
      }

      .mode-panel {
        display: none;
      }

      .mode-panel.active {
        display: block;
      }

      input[type="text"], textarea {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 8px 10px;
        background: var(--panel);
        color: var(--text);
        font-size: 0.85rem;
        font-family: inherit;
      }

      textarea {
        font-family: "JetBrains Mono", "Consolas", monospace;
        font-size: 0.75rem;
        resize: vertical;
        min-height: 60px;
      }

      .status-badge {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 10px;
        font-size: 0.7rem;
        font-weight: 600;
        text-transform: uppercase;
      }

      .status-badge.disconnected {
        background: var(--border);
        color: var(--muted);
      }

      .status-badge.connected {
        background: #10b981;
        color: #fff;
      }

      .status-badge.error {
        background: #ef4444;
        color: #fff;
      }

      @media (max-width: 900px) {
        .layout {
          grid-template-columns: 1fr;
        }

        .panel {
          border-right: none;
          border-bottom: 1px solid var(--border);
        }

        iframe {
          height: 70vh;
        }
      }
    </style>
  </head>
  <body>
    <div class="layout">
      <aside class="panel">
        <h1>DWSIM MCP App Harness</h1>
        <p>Test apps with mock data or live MCP server.</p>

        <div class="control-group">
          <label for="app-select">App</label>
          <select id="app-select">
            <option value="scenario-setup">scenario-setup</option>
            <option value="simulation-results">simulation-results</option>
            <option value="stream-properties">stream-properties</option>
            <option value="flowsheet-viewer">flowsheet-viewer</option>
            <option value="sensitivity-analysis">sensitivity-analysis</option>
            <option value="diagnostics">diagnostics</option>
          </select>
          <button id="load-app">Load App</button>
        </div>

        <div class="divider"></div>

        <div class="mode-tabs">
          <button class="mode-tab active" data-mode="mock">Mock Data</button>
          <button class="mode-tab" data-mode="live">Live Server</button>
        </div>

        <!-- Mock Mode Panel -->
        <div id="mock-panel" class="mode-panel active">
          <div class="control-group">
            <label for="mock-select">Mock Data</label>
            <select id="mock-select">
              <option value="simulation-result-converged.json">simulation-result-converged</option>
              <option value="simulation-result-failed.json">simulation-result-failed</option>
              <option value="stream-properties.json">stream-properties</option>
              <option value="flowsheet-topology.json">flowsheet-topology</option>
              <option value="sensitivity-2d.json">sensitivity-2d (multi-output)</option>
              <option value="sensitivity-3d.json">sensitivity-3d (surface)</option>
              <option value="sensitivity-real-format.json">sensitivity (real MCP format)</option>
              <option value="diagnostics.json">diagnostics</option>
            </select>
            <button id="send-mock">Send Tool Result</button>
            <label style="display:flex;align-items:center;gap:6px;margin-top:6px;">
              <input type="checkbox" id="auto-send" checked />
              Auto-send on app load
            </label>
          </div>
        </div>

        <!-- Live Mode Panel -->
        <div id="live-panel" class="mode-panel">
          <div class="control-group">
            <label>Status: <span id="live-status" class="status-badge disconnected">Disconnected</span></label>
          </div>
          <div class="control-group">
            <label for="server-url">MCP Server URL</label>
            <input type="text" id="server-url" placeholder="https://your-domain.com/mcp" />
          </div>
          <div class="control-group">
            <label for="client-id">Client ID</label>
            <input type="text" id="client-id" placeholder="OAuth client ID" />
          </div>
          <div class="control-group">
            <label for="client-secret">Client Secret</label>
            <input type="text" id="client-secret" placeholder="OAuth client secret" />
          </div>
          <div class="control-group">
            <label for="session-id">Session ID</label>
            <input type="text" id="session-id" placeholder="Auto-filled on connect" readonly />
          </div>
          <div class="control-group">
            <button id="live-connect">Login &amp; Connect</button>
            <button id="live-disconnect" class="secondary" disabled>Disconnect</button>
          </div>
          <div class="divider"></div>
          <div class="control-group">
            <label for="tool-select">Tool</label>
            <select id="tool-select">
              <option value="get_diagnostics">get_diagnostics</option>
              <option value="list_objects">list_objects</option>
              <option value="run">run (simulation)</option>
              <option value="get_results">get_results</option>
              <option value="sensitivity_analysis">sensitivity_analysis</option>
            </select>
          </div>
          <div class="control-group">
            <label for="tool-args">Arguments (JSON)</label>
            <textarea id="tool-args">{}</textarea>
          </div>
          <div class="control-group">
            <button id="call-tool">Call Tool</button>
          </div>
        </div>

        <div class="divider"></div>

        <div class="control-group">
          <label>Theme</label>
          <button id="toggle-theme" class="secondary">Toggle Theme</button>
        </div>

        <div class="control-group">
          <label>Message Log</label>
          <div id="log" class="log"></div>
        </div>
      </aside>

      <section class="iframe-wrap">
        <iframe id="app-frame" title="MCP App Preview"></iframe>
      </section>
    </div>

          var array = new Uint8Array(32);
          crypto.getRandomValues(array);
          return btoa(String.fromCharCode.apply(null, array))
            .replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");

        function generateCodeChallenge(verifier) {
          var encoder = new TextEncoder();
          var data = encoder.encode(verifier);
          return crypto.subtle.digest("SHA-256", data).then(function (hash) {
            return btoa(String.fromCharCode.apply(null, new Uint8Array(hash)))

          if (!clientId || !clientSecret) {
            return Promise.reject(new Error("Client ID and Client Secret are required"));
          }

          var baseUrl = serverUrl.replace(/\/mcp\/?$/, "");
          var redirectUri = baseUrl + "/oauth/callback";
          var codeVerifier = generateCodeVerifier();
          var state = Math.random().toString(36).substring(2);

          appendLog("AUTH", "Starting OAuth login...");

          return generateCodeChallenge(codeVerifier).then(function (codeChallenge) {
            return new Promise(function (resolve, reject) {
              // Discover auth server
              fetch(baseUrl + "/.well-known/oauth-protected-resource")
                .then(function (r) { return r.json(); })
                .then(function (pr) {
                  var authServer = (pr.authorization_servers || [])[0];
                  if (!authServer) throw new Error("No authorization server found");
                  authServer = authServer.replace(/\/$/, "");

                  var authorizeUrl = authServer + "/oauth/authorize"
                    + "?response_type=code"
                    + "&client_id=" + encodeURIComponent(clientId)
                    + "&redirect_uri=" + encodeURIComponent(redirectUri)
                    + "&code_challenge=" + encodeURIComponent(codeChallenge)
                    + "&code_challenge_method=S256"
                    + "&state=" + encodeURIComponent(state)
                    + "&scope=openid%20profile%20email";

                  appendLog("AUTH", "Opening login popup...");

                  // Open popup for login
                  var popup = window.open(authorizeUrl, "oauth-login", "width=500,height=700,popup=yes");
                  if (!popup) {
                    throw new Error("Popup blocked - please allow popups for this page");
                  }

                  // Listen for callback message from popup
                  function onMessage(event) {
                    if (!event.data || event.data.type !== "oauth-callback") return;
                    window.removeEventListener("message", onMessage);
                    clearInterval(pollTimer);

                    if (event.data.error) {
                      reject(new Error("OAuth error: " + event.data.error));
                      return;
                    }
                    if (event.data.state !== state) {
                      reject(new Error("OAuth state mismatch"));
                      return;
                    }

                    var authCode = event.data.code;
                    appendLog("AUTH", "Got auth code, exchanging for token...");

                    // Exchange code for token via proxy
                    var tokenBody = new URLSearchParams();
                    tokenBody.append("grant_type", "authorization_code");
                    tokenBody.append("client_id", clientId);
                    tokenBody.append("client_secret", clientSecret);
                    tokenBody.append("code", authCode);
                    tokenBody.append("redirect_uri", redirectUri);
                    tokenBody.append("code_verifier", codeVerifier);

                    fetch(baseUrl + "/oauth/token", {
                      method: "POST",
                      headers: { "Content-Type": "application/x-www-form-urlencoded" },
                      body: tokenBody.toString()
                    })
                    .then(function (r) { return r.json(); })
                    .then(function (json) {
                      if (json.error) {
                        reject(new Error("Token error: " + (json.error_description || json.error)));
                        return;
                      }
                      if (!json.access_token) {
                        reject(new Error("No access_token in response"));
                        return;
                      }
                      appendLog("AUTH", "Got access token (expires in " + (json.expires_in || "?") + "s)");
                      resolve(json.access_token);
                    })
                    .catch(reject);
                  }

                  window.addEventListener("message", onMessage);

                  // Poll to detect if popup was closed without completing
                  var pollTimer = setInterval(function () {
                    if (popup.closed) {
                      clearInterval(pollTimer);
                      window.removeEventListener("message", onMessage);
                      reject(new Error("Login popup was closed"));
                    }
                  }, 1000);
                })
                .catch(reject);
            });
          });
        }

        // MCP transport session ID (from Streamable HTTP)
        var mcpTransportSessionId = null;
        var mcpRequestId = 0;

        // Low-level MCP POST: handles session header and SSE responses
        function mcpPost(body) {
          var url = serverUrlInput.value.trim();
          if (!url) {
            return Promise.reject(new Error("Server URL is required"));
          }

          var headers = {
            "Content-Type": "application/json",
            "Accept": "application/json, text/event-stream",
            "Authorization": "Bearer " + liveAccessToken
          };
          if (mcpTransportSessionId) {
            headers["Mcp-Session-Id"] = mcpTransportSessionId;
          }

          return fetch(url, {
            method: "POST",
            headers: headers,
            body: JSON.stringify(body)
          })
          .then(function (response) {
            // Capture transport session ID from response
            var sid = response.headers.get("Mcp-Session-Id");
            if (sid) {
              mcpTransportSessionId = sid;
            }

            if (!response.ok) {
              if (response.status === 401) {
                liveAccessToken = null;
                setLiveStatus("disconnected");
                throw new Error("Token expired - reconnect required");
              }
              return response.text().then(function (text) {
                throw new Error("HTTP " + response.status + ": " + text.substring(0, 200));
              });
            }

            // 202 Accepted / 204 No Content = notification acknowledged
            if (response.status === 202 || response.status === 204) {
              return null;
            }

            var contentType = response.headers.get("Content-Type") || "";

            // Handle SSE response (text/event-stream)
            if (contentType.indexOf("text/event-stream") !== -1) {
              return response.text().then(function (text) {
                // Parse SSE events - find JSON-RPC responses from "data:" lines
                var lines = text.split("\n");
                var lastData = null;
                for (var i = 0; i < lines.length; i++) {
                  var line = lines[i].trim();
                  if (line.indexOf("data:") === 0) {
                    var data = line.substring(5).trim();
                    if (data) lastData = data;
                  }
                }
                if (lastData) {
                  return JSON.parse(lastData);
                }
                throw new Error("No data in SSE response");
              });
            }

            // Handle JSON response
            return response.json();
          });
        }

        // High-level MCP call: sends JSON-RPC request and extracts result
        function mcpCall(method, params) {
          if (!liveAccessToken) {
            return Promise.reject(new Error("Not authenticated - click Connect first"));
          }

          mcpRequestId++;
          var body = {
            jsonrpc: "2.0",
            id: mcpRequestId,
            method: method,
            params: params || {}
          };

          appendLog("REQUEST", method + " -> " + JSON.stringify(params || {}).substring(0, 100));

          return mcpPost(body).then(function (json) {
            if (json.error) {
              throw new Error(json.error.message || JSON.stringify(json.error));
            }
            appendLog("RESPONSE", JSON.stringify(json.result).substring(0, 200));
            return json.result;
          });
        }

        // Send a JSON-RPC notification (no id, no response expected)
        function mcpNotify(method, params) {
          var body = {
            jsonrpc: "2.0",
            method: method,
            params: params || {}
          };
          appendLog("REQUEST", "NOTIFY " + method);
          return mcpPost(body).then(function () {
            return null; // notifications have no meaningful response
          });
        }

        // Initialize the MCP protocol session
        function mcpInitialize() {
          appendLog("MCP", "Initializing MCP protocol...");

          return mcpCall("initialize", {
            protocolVersion: "2025-03-26",
            capabilities: {},
            clientInfo: { name: "dwsim-test-harness", version: "1.0.0" }
          })
          .then(function (result) {
            appendLog("MCP", "Server: " + (result.serverInfo ? result.serverInfo.name : "unknown"));
            // Send initialized notification
            return mcpNotify("notifications/initialized", {});
          })
          .then(function () {
            appendLog("MCP", "Protocol initialized");
          });
        }

        function setLiveStatus(status) {
          liveStatus.className = "status-badge " + status;
          liveStatus.textContent = status.charAt(0).toUpperCase() + status.slice(1);
        }

        // Connect: get token, initialize MCP, then create DWSIM session
        connectBtn.addEventListener("click", function () {
          setLiveStatus("connecting");

          getAccessToken()
            .then(function (token) {
              liveAccessToken = token;
              return mcpInitialize();
            })
            .then(function () {
              appendLog("LIVE", "Creating DWSIM session...");
              return mcpCall("tools/call", { name: "create_session", arguments: {} });
            })
            .then(function (result) {
              // Extract session_id from result
              var content = result.content || [];
              var textContent = content.find(function (c) { return c.type === "text"; });
              if (textContent && textContent.text) {
                try {
                  var parsed = JSON.parse(textContent.text);
                  liveSessionId = parsed.session_id;
                } catch (e) {
                  if (result.structuredContent && result.structuredContent.session_id) {
                    liveSessionId = result.structuredContent.session_id;
                  }
                }
              }
              if (result.structuredContent && result.structuredContent.session_id) {
                liveSessionId = result.structuredContent.session_id;
              }

              if (liveSessionId) {
                sessionIdInput.value = liveSessionId;
                setLiveStatus("connected");
                connectBtn.disabled = true;
                disconnectBtn.disabled = false;
                appendLog("LIVE", "Connected! Session: " + liveSessionId);
              } else {
                throw new Error("No session_id in response: " + JSON.stringify(result).substring(0, 200));
              }
            })
            .catch(function (err) {
              setLiveStatus("error");
              liveAccessToken = null;
              mcpTransportSessionId = null;
              appendLog("ERROR", err.message);
            });
        });

        // Disconnect: close session
        disconnectBtn.addEventListener("click", function () {
          if (!liveSessionId) return;

          appendLog("LIVE", "Closing session...");
          mcpCall("tools/call", { name: "close_session", arguments: { session_id: liveSessionId } })
            .then(function () {
              liveSessionId = null;
              liveAccessToken = null;
              sessionIdInput.value = "";
              setLiveStatus("disconnected");
              connectBtn.disabled = false;
              disconnectBtn.disabled = true;
              appendLog("LIVE", "Disconnected");
            })
            .catch(function (err) {
              // Still clean up locally even on error
              liveSessionId = null;
              liveAccessToken = null;
              sessionIdInput.value = "";
              setLiveStatus("disconnected");
              connectBtn.disabled = false;
              disconnectBtn.disabled = true;
              appendLog("ERROR", err.message);
            });
        });

        // Call tool
        callToolBtn.addEventListener("click", function () {
          var toolName = toolSelect.value;
          var argsText = toolArgsInput.value.trim() || "{}";
          var args;

          try {
            args = JSON.parse(argsText);
          } catch (e) {
            appendLog("ERROR", "Invalid JSON in arguments: " + e.message);
            return;
          }

          // Auto-inject session_id for tools that need it
          if (liveSessionId && !args.session_id) {
            args.session_id = liveSessionId;
          }

          appendLog("LIVE", "Calling " + toolName + "...");

          mcpCall("tools/call", { name: toolName, arguments: args })
            .then(function (result) {
              appendLog("LIVE", "Tool returned successfully");

              // Extract structured content and send to app
              var payload = null;
              if (result.structuredContent) {
                payload = result.structuredContent;
              } else if (result.content) {
                var textContent = result.content.find(function (c) { return c.type === "text"; });
                if (textContent && textContent.text) {
                  try {
                    payload = JSON.parse(textContent.text);
                  } catch (e) {
                    payload = { raw: textContent.text };
                  }
                }
              }

              if (payload && iframe.contentWindow) {
                bridge.sendToolResult({
                  content: result.content || [{ type: "text", text: "Live tool result" }],
                  structuredContent: payload,
                });
                appendLog("LIVE", "Sent result to app");
              }
            })
            .catch(function (err) {
              appendLog("ERROR", err.message);
            });
        });

        // Update tool args placeholder based on selected tool
        toolSelect.addEventListener("change", function () {
          var tool = toolSelect.value;
          var examples = {
            "get_diagnostics": "{}",
            "list_objects": "{}",
            "run": "{}",
            "get_results": "{}",
            "sensitivity_analysis": '{\n  "variable": {\n    "object_id": "Feed",\n    "parameter_name": "Temperature",\n    "min": 280,\n    "max": 380\n  },\n  "steps": 10,\n  "outputs": [\n    {"object_id": "VaporOut", "parameter_name": "MolarFlow"}\n  ]\n}'
          };
          toolArgsInput.value = examples[tool] || "{}";
        });

        // Persist settings to localStorage
        function saveSettings() {
          try {
            localStorage.setItem("dwsim-harness-url", serverUrlInput.value);
            localStorage.setItem("dwsim-harness-client-id", clientIdInput.value);
            // Note: storing client secret in localStorage is not ideal for production
            // but acceptable for a development test harness
            localStorage.setItem("dwsim-harness-client-secret", clientSecretInput.value);
          } catch (e) { /* ignore */ }
        }

        function loadSettings() {
          try {
            var url = localStorage.getItem("dwsim-harness-url");
            var clientId = localStorage.getItem("dwsim-harness-client-id");
            var clientSecret = localStorage.getItem("dwsim-harness-client-secret");
            if (url) serverUrlInput.value = url;
            if (clientId) clientIdInput.value = clientId;
            if (clientSecret) clientSecretInput.value = clientSecret;
          } catch (e) { /* ignore */ }
        }

        serverUrlInput.addEventListener("change", saveSettings);
        clientIdInput.addEventListener("change", saveSettings);
        clientSecretInput.addEventListener("change", saveSettings);
        loadSettings();

        // Map apps to their default mock data
        var APP_TO_MOCK = {
          "scenario-setup": "simulation-result-converged.json",
          "simulation-results": "simulation-result-converged.json",
          "stream-properties": "stream-properties.json",
          "flowsheet-viewer": "flowsheet-topology.json",
          "sensitivity-analysis": "sensitivity-2d.json",
          "diagnostics": "diagnostics.json"
        };

        function loadApp() {
          var appName = appSelect.value;
          iframe.src = "../templates/" + appName + "/index.html";
          appendLog("SYSTEM", "Loaded app " + appName);

          // Auto-select matching mock data
          var defaultMock = APP_TO_MOCK[appName];
          if (defaultMock && mockSelect.querySelector('option[value="' + defaultMock + '"]')) {
            mockSelect.value = defaultMock;
            appendLog("SYSTEM", "Auto-selected mock: " + defaultMock);
          }

          // Auto-send data after iframe loads
          var autoSend = document.getElementById("auto-send");
          if (autoSend && autoSend.checked) {
            iframe.onload = function () {
              setTimeout(function () {
                sendMock();
              }, 300); // Small delay to ensure app JS is initialized
            };
          }
        }

        function sendMock() {
          var fileName = mockSelect.value;
          var data = MOCK_DATA[fileName];
          if (!data) {
            appendLog("ERROR", "Mock data not found: " + fileName);
            return;
          }
          if (!iframe.contentWindow) {
            appendLog("ERROR", "Iframe not ready - click Load App first");
            return;
          }
          bridge.sendToolResult({
            content: [{ type: "text", text: "Mock tool result" }],
            structuredContent: data,
          });
          appendLog("SYSTEM", "Sent mock data " + fileName + " (keys: " + Object.keys(data).join(", ") + ")");
        }

        function toggleTheme() {
          theme = theme === "light" ? "dark" : "light";
          document.documentElement.setAttribute("data-theme", theme);
          bridge.sendHostContext({ theme: theme });
          appendLog("SYSTEM", "Theme set to " + theme);
        }

        document.getElementById("load-app").addEventListener("click", loadApp);
        document.getElementById("send-mock").addEventListener("click", sendMock);
        document.getElementById("toggle-theme").addEventListener("click", toggleTheme);

        // ── Scenario Orchestration ──────────────────────────────────────

        // Listen for run-scenario requests from the scenario-setup app
        window.addEventListener("message", function (event) {
          if (!event.data || event.data.type !== "dwsim-run-scenario") return;
          if (event.source !== iframe.contentWindow) return;

          appendLog("SCENARIO", "Received run request from app");

          if (currentMode !== "live" || !liveAccessToken) {
            sendScenarioError("Not connected to live server. Switch to Live Server mode and connect first.");
            return;
          }

          runScenario(event.data.config);
        });

        function sendScenarioProgress(progress, message) {
          if (!iframe.contentWindow) return;
          bridge.sendToolResult({
            content: [{ type: "text", text: message }],
            structuredContent: { type: "scenario-progress", progress: progress, message: message }
          });
        }

        function sendScenarioError(message) {
          if (!iframe.contentWindow) return;
          appendLog("SCENARIO", "ERROR: " + message);
          bridge.sendToolResult({
            content: [{ type: "text", text: message }],
            structuredContent: { type: "scenario-error", message: message }
          });
        }

        function extractPayload(result) {
          if (result && result.structuredContent) return result.structuredContent;
          var content = (result && result.content) || [];
          for (var i = 0; i < content.length; i++) {
            if (content[i].type === "text" && content[i].text) {
              try { return JSON.parse(content[i].text); } catch (e) { /* skip */ }
            }
          }
          return result || {};
        }

        function extractField(result, field) {
          var payload = extractPayload(result);
          return (payload && payload[field]) || null;
        }

        // Call a tool and throw on tool-level errors (isError: true)
        async function scenarioToolCall(toolName, args) {
          var result = await mcpCall("tools/call", { name: toolName, arguments: args });
          if (result && result.isError) {
            var errPayload = extractPayload(result);
            var msg = (errPayload && errPayload.message) || "Tool error";
            throw new Error(toolName + " failed: " + msg);
          }
          appendLog("SCENARIO", toolName + " -> " + JSON.stringify(extractPayload(result)).substring(0, 120));
          return result;
        }

        async function runScenario(config) {
          var scenarioSessionId = null;
          try {
            // 1. Create DWSIM session
            sendScenarioProgress(0.05, "Creating DWSIM session...");
            var sessionResult = await scenarioToolCall("create_session", {});
            scenarioSessionId = extractField(sessionResult, "session_id");
            if (!scenarioSessionId) throw new Error("No session_id in create_session response");
            appendLog("SCENARIO", "Session: " + scenarioSessionId);
            sendScenarioProgress(0.1, "Session created: " + scenarioSessionId);

            // 2. Add compounds
            var compounds = Object.keys(config.composition);
            for (var i = 0; i < compounds.length; i++) {
              var cName = compounds[i];
              await scenarioToolCall("add_compound", {
                session_id: scenarioSessionId, compound_name: cName
              });
              var compProgress = 0.1 + 0.15 * ((i + 1) / compounds.length);
              sendScenarioProgress(compProgress, "Added compound: " + cName);
            }

            // 3. Set property package
            sendScenarioProgress(0.28, "Setting property package: " + config.property_package);
            await scenarioToolCall("set_property_package", {
              session_id: scenarioSessionId, package_name: config.property_package
            });
            sendScenarioProgress(0.3, "Property package set");

            // 4. Add feed stream
            sendScenarioProgress(0.35, "Creating feed stream...");
            await scenarioToolCall("add_stream", {
              session_id: scenarioSessionId,
              stream_name: "Feed",
              stream_type: "Material",
              is_source: true,
              temperature: config.temperature_k,
              pressure: config.pressure_pa,
              molar_flow: config.molar_flow,
              composition: config.composition
            });
            sendScenarioProgress(0.4, "Feed stream created");

            // 5. Add outlet streams
            sendScenarioProgress(0.42, "Creating outlet streams...");
            await scenarioToolCall("add_stream", {
              session_id: scenarioSessionId,
              stream_name: "VaporOut",
              stream_type: "Material",
              is_source: false
            });
            await scenarioToolCall("add_stream", {
              session_id: scenarioSessionId,
              stream_name: "LiquidOut1",
              stream_type: "Material",
              is_source: false
            });
            await scenarioToolCall("add_stream", {
              session_id: scenarioSessionId,
              stream_name: "LiquidOut2",
              stream_type: "Material",
              is_source: false
            });
            sendScenarioProgress(0.5, "Outlet streams created");

            // 6. Add separator unit
            sendScenarioProgress(0.52, "Creating separator unit...");
            await scenarioToolCall("add_unit", {
              session_id: scenarioSessionId,
              unit_name: "Separator",
              unit_type: "separator"
            });
            sendScenarioProgress(0.55, "Separator created");

            // 7. List objects to get the actual IDs (S1, S2, U1, etc.)
            sendScenarioProgress(0.57, "Resolving object IDs...");
            var listResult = await scenarioToolCall("list_objects", {
              session_id: scenarioSessionId
            });
            var objects = extractPayload(listResult);
            appendLog("SCENARIO", "Objects: " + JSON.stringify(objects).substring(0, 300));

            // Build ID lookup: name -> id
            var streamMap = {};
            var unitMap = {};
            var streams = objects.streams || [];
            var units = objects.units || [];
            streams.forEach(function (s) { streamMap[s.name] = s.id; });
            units.forEach(function (u) { unitMap[u.name] = u.id; });

            var feedId = streamMap["Feed"];
            var vapId = streamMap["VaporOut"];
            var liq1Id = streamMap["LiquidOut1"];
            var liq2Id = streamMap["LiquidOut2"];
            var sepId = unitMap["Separator"];

            if (!feedId || !vapId || !liq1Id || !liq2Id || !sepId) {
              throw new Error(
                "Could not resolve all IDs. Streams: " + JSON.stringify(streamMap) +
                " Units: " + JSON.stringify(unitMap)
              );
            }
            appendLog("SCENARIO", "IDs: Feed=" + feedId + " Vap=" + vapId + " Liq1=" + liq1Id + " Liq2=" + liq2Id + " Sep=" + sepId);
            sendScenarioProgress(0.6, "IDs resolved: " + feedId + ", " + sepId);

            // 8. Flash feed stream
            sendScenarioProgress(0.62, "Flashing feed stream...");
            await scenarioToolCall("flash_stream", {
              session_id: scenarioSessionId, stream_id: feedId
            });
            sendScenarioProgress(0.65, "Feed stream flashed");

            // 9. Connect streams to separator
            sendScenarioProgress(0.67, "Connecting streams...");
            await scenarioToolCall("connect", {
              session_id: scenarioSessionId,
              source_id: feedId, target_id: sepId, port_name: "Inlet"
            });
            await scenarioToolCall("connect", {
              session_id: scenarioSessionId,
              source_id: sepId, target_id: vapId, port_name: "VaporOutlet"
            });
            await scenarioToolCall("connect", {
              session_id: scenarioSessionId,
              source_id: sepId, target_id: liq1Id, port_name: "LiquidOutlet1"
            });
            await scenarioToolCall("connect", {
              session_id: scenarioSessionId,
              source_id: sepId, target_id: liq2Id, port_name: "LiquidOutlet2"
            });
            sendScenarioProgress(0.75, "All streams connected");

            // 10. Run simulation
            sendScenarioProgress(0.78, "Running DWSIM solver...");
            await scenarioToolCall("run", { session_id: scenarioSessionId });
            sendScenarioProgress(0.88, "Solver complete");

            // 11. Get results
            sendScenarioProgress(0.9, "Retrieving results...");
            var resultsResponse = await scenarioToolCall("get_results", {
              session_id: scenarioSessionId
            });
            var resultsPayload = extractPayload(resultsResponse);
            sendScenarioProgress(0.95, "Results retrieved");

            // 12. Send results to app
            bridge.sendToolResult({
              content: [{ type: "text", text: "Simulation results" }],
              structuredContent: resultsPayload
            });
            appendLog("SCENARIO", "Simulation complete - results sent to app");

            // 13. Close the scenario session (keep main connection alive)
            await mcpCall("tools/call", {
              name: "close_session",
              arguments: { session_id: scenarioSessionId }
            });
            appendLog("SCENARIO", "Scenario session closed");

          } catch (err) {
            appendLog("SCENARIO", "FAILED: " + err.message);
            sendScenarioError(err.message);

            // Clean up on error
            if (scenarioSessionId) {
              try {
                await mcpCall("tools/call", {
                  name: "close_session",
                  arguments: { session_id: scenarioSessionId }
                });
              } catch (e) { /* ignore cleanup errors */ }
            }
          }
        }

        // ── Boot ────────────────────────────────────────────────────────

        loadApp();
      })();
    </script>
  </body>
</html>
