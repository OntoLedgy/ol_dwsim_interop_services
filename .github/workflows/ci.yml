name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

jobs:
  lint:
    name: Lint (Python)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - name: Install dependencies
        working-directory: mcp_service/server
        run: uv sync --dev
      - name: Ruff
        working-directory: mcp_service/server
        run: uv run ruff check .
      - name: Mypy
        working-directory: mcp_service/server
        run: uv run mypy .

  test-python:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - name: Install dependencies
        working-directory: mcp_service/server
        run: uv sync --dev
      - name: Run pytest
        working-directory: mcp_service/server
        run: |
          mkdir -p test-results
          uv run pytest -m "not integration" --junitxml=test-results/pytest.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results-${{ matrix.python-version }}
          path: mcp_service/server/test-results/pytest.xml

  build-csharp:
    name: Build (C#)
    runs-on: windows-latest
    env:
      DWSIM_BINARIES_URL: https://github.com/OntoLedgy/dwsim/releases/download/v9.0.5-mcp/dwsim_binaries.zip
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json', '**/*.csproj', '**/*.sln', '**/nuget.config') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
      - name: Cache DWSIM binaries
        id: cache-dwsim
        uses: actions/cache@v4
        with:
          path: mcp_service/dwsim_worker/dwsim_binaries
          key: dwsim-binaries-v9.0.5-mcp
      - name: Download DWSIM binaries
        if: steps.cache-dwsim.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $targetDir = "mcp_service/dwsim_worker/dwsim_binaries/x64/Debug"
          New-Item -ItemType Directory -Path $targetDir -Force | Out-Null
          $zipPath = "$env:TEMP/dwsim_binaries.zip"
          Invoke-WebRequest -Uri $env:DWSIM_BINARIES_URL -OutFile $zipPath
          Expand-Archive -Path $zipPath -DestinationPath $targetDir -Force
          Remove-Item $zipPath
      - name: Create DWSIM config
        shell: pwsh
        run: |
          $configPath = "mcp_service/dwsim_worker/DwsimWorker/dwsim.config.json"
          $absolutePath = (Resolve-Path "mcp_service/dwsim_worker/dwsim_binaries/x64/Debug").Path -replace '\\', '/'
          @{ dwsim_path = $absolutePath } | ConvertTo-Json | Set-Content $configPath
      - name: Build
        working-directory: mcp_service/dwsim_worker
        shell: cmd
        run: build.bat

  test-integration:
    name: Integration (Full Stack)
    runs-on: windows-latest
    needs: [lint, build-csharp]
    env:
      DWSIM_BINARIES_URL: https://github.com/OntoLedgy/dwsim/releases/download/v9.0.5-mcp/dwsim_binaries.zip
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json', '**/*.csproj', '**/*.sln', '**/nuget.config') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
      - name: Cache DWSIM binaries
        id: cache-dwsim
        uses: actions/cache@v4
        with:
          path: mcp_service/dwsim_worker/dwsim_binaries
          key: dwsim-binaries-v9.0.5-mcp
      - name: Download DWSIM binaries
        if: steps.cache-dwsim.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $targetDir = "mcp_service/dwsim_worker/dwsim_binaries/x64/Debug"
          New-Item -ItemType Directory -Path $targetDir -Force | Out-Null
          $zipPath = "$env:TEMP/dwsim_binaries.zip"
          Invoke-WebRequest -Uri $env:DWSIM_BINARIES_URL -OutFile $zipPath
          Expand-Archive -Path $zipPath -DestinationPath $targetDir -Force
          Remove-Item $zipPath
      - name: Create DWSIM config
        shell: pwsh
        run: |
          $configPath = "mcp_service/dwsim_worker/DwsimWorker/dwsim.config.json"
          $absolutePath = (Resolve-Path "mcp_service/dwsim_worker/dwsim_binaries/x64/Debug").Path -replace '\\', '/'
          @{ dwsim_path = $absolutePath } | ConvertTo-Json | Set-Content $configPath
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - name: Install Python dependencies
        working-directory: mcp_service/server
        run: uv sync --dev
      - name: Build worker
        working-directory: mcp_service/dwsim_worker
        shell: cmd
        run: build.bat
      - name: Run integration tests
        working-directory: mcp_service/server
        run: |
          mkdir -p test-results
          uv run pytest -m integration --junitxml=test-results/pytest.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: mcp_service/server/test-results/pytest.xml
