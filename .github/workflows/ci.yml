name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    name: Lint (Python)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('mcp_service/server/requirements.txt', 'mcp_service/server/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install dependencies
        working-directory: mcp_service/server
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .
      - name: Ruff
        working-directory: mcp_service/server
        run: ruff check .
      - name: Mypy
        working-directory: mcp_service/server
        run: mypy .

  test-python:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('mcp_service/server/requirements.txt', 'mcp_service/server/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-
            ${{ runner.os }}-pip-
      - name: Install dependencies
        working-directory: mcp_service/server
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .
      - name: Run pytest
        working-directory: mcp_service/server
        run: |
          python -c "import os; os.makedirs('test-results', exist_ok=True)"
          pytest -m "not integration" --junitxml=test-results/pytest.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results-${{ matrix.python-version }}
          path: mcp_service/server/test-results/pytest.xml

  build-csharp:
    name: Build (C#)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json', '**/*.csproj', '**/*.sln', '**/nuget.config') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
      - name: Build
        working-directory: mcp_service/dwsim_worker
        shell: cmd
        run: build.bat

  test-integration:
    name: Integration (Full Stack)
    runs-on: windows-latest
    needs: [lint, build-csharp]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json', '**/*.csproj', '**/*.sln', '**/nuget.config') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('mcp_service/server/requirements.txt', 'mcp_service/server/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install Python dependencies
        working-directory: mcp_service/server
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .
      - name: Build worker
        working-directory: mcp_service/dwsim_worker
        shell: cmd
        run: build.bat
      - name: Run integration tests
        working-directory: mcp_service/server
        run: |
          python -c "import os; os.makedirs('test-results', exist_ok=True)"
          pytest -m integration --junitxml=test-results/pytest.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: mcp_service/server/test-results/pytest.xml
