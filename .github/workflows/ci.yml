name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

jobs:
  lint:
    name: Lint (Python)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - name: Install dependencies
        working-directory: mcp_service/server
        run: uv sync --dev
      - name: Ruff
        working-directory: mcp_service/server
        run: uv run ruff check .
      - name: Mypy
        working-directory: mcp_service/server
        run: uv run mypy .

  test-python:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - name: Install dependencies
        working-directory: mcp_service/server
        run: uv sync --dev
      - name: Run pytest
        working-directory: mcp_service/server
        run: |
          mkdir -p test-results
          uv run pytest -m "not integration" --junitxml=test-results/pytest.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results-${{ matrix.python-version }}
          path: mcp_service/server/test-results/pytest.xml

  build-csharp:
    name: Build (C#)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up DWSIM build environment
        uses: ./.github/actions/setup-dwsim
      - name: Build
        working-directory: mcp_service/dwsim_worker
        shell: cmd
        run: build.bat

  test-integration:
    name: Integration (Full Stack)
    runs-on: windows-latest
    needs: [lint, build-csharp]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up DWSIM build environment
        uses: ./.github/actions/setup-dwsim
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - name: Install Python dependencies
        working-directory: mcp_service/server
        run: uv sync --dev
      - name: Build worker
        working-directory: mcp_service/dwsim_worker
        shell: cmd
        run: build.bat
      - name: Run integration tests
        working-directory: mcp_service/server
        run: |
          mkdir -p test-results
          uv run pytest -m integration --junitxml=test-results/pytest.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: mcp_service/server/test-results/pytest.xml
