name: Release

on:
  push:
    tags:
      - "v*.*.*"

env:
  DWSIM_BINARIES_URL: https://github.com/OntoLedgy/dwsim/releases/download/v9.0.5-mcp/dwsim_binaries.zip

jobs:
  build-csharp:
    name: Build (C#)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json', '**/*.csproj', '**/*.sln', '**/nuget.config') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
      - name: Cache DWSIM binaries
        id: cache-dwsim
        uses: actions/cache@v4
        with:
          path: mcp_service/dwsim_worker/dwsim_binaries
          key: dwsim-binaries-v9.0.5-mcp
      - name: Download DWSIM binaries
        if: steps.cache-dwsim.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $targetDir = "mcp_service/dwsim_worker/dwsim_binaries/x64/Debug"
          New-Item -ItemType Directory -Path $targetDir -Force | Out-Null
          $zipPath = "$env:TEMP/dwsim_binaries.zip"
          Invoke-WebRequest -Uri $env:DWSIM_BINARIES_URL -OutFile $zipPath
          Expand-Archive -Path $zipPath -DestinationPath $targetDir -Force
          Remove-Item $zipPath
      - name: Create DWSIM config
        shell: pwsh
        run: |
          $configPath = "mcp_service/dwsim_worker/DwsimWorker/dwsim.config.json"
          $absolutePath = (Resolve-Path "mcp_service/dwsim_worker/dwsim_binaries/x64/Debug").Path -replace '\\', '/'
          @{ dwsim_path = $absolutePath } | ConvertTo-Json | Set-Content $configPath
      - name: Build
        working-directory: mcp_service/dwsim_worker
        shell: cmd
        run: build.bat
      - name: Upload DwsimWorker binaries
        uses: actions/upload-artifact@v4
        with:
          name: dwsimworker-binaries
          path: mcp_service/dwsim_worker/DwsimWorker/bin/Debug/**

  build-python:
    name: Build (Python)
    runs-on: windows-latest
    needs: build-csharp
    outputs:
      version: ${{ steps.validate-tag.outputs.version }}
      tag-valid: ${{ steps.validate-tag.outputs.tag-valid }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate tag matches pyproject.toml
        id: validate-tag
        shell: bash
        run: |
          python - <<'PY'
          import os
          import re
          import sys
          import tomllib
          from pathlib import Path

          tag = os.environ.get("GITHUB_REF_NAME", "")
          if not re.match(r"^v\d+\.\d+\.\d+$", tag):
            print(f"Invalid tag format: {tag}", file=sys.stderr)
            sys.exit(1)

          pyproject = Path("mcp_service/server/pyproject.toml").read_text(encoding="utf-8")
          data = tomllib.loads(pyproject)
          version = data["project"]["version"]
          expected = f"v{version}"
          if tag != expected:
            print(f"Tag {tag} does not match project version {version}", file=sys.stderr)
            sys.exit(1)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
            handle.write(f"version={version}\n")
            handle.write("tag-valid=true\n")
          PY
      - name: Download DwsimWorker binaries
        uses: actions/download-artifact@v4
        with:
          name: dwsimworker-binaries
          path: mcp_service/dwsim_worker/DwsimWorker/bin/Debug
      - name: Package prebuilt binaries
        run: python scripts/package_prebuilt.py
      - name: Create standalone DwsimWorker zip
        shell: pwsh
        run: |
          $version = "${{ steps.validate-tag.outputs.version }}"
          $sourceDir = "mcp_service/server/prebuilt/DwsimWorker"
          $zipDir = "mcp_service/server/dist"
          $zipPath = Join-Path $zipDir "DwsimWorker-$version.zip"

          if (-not (Test-Path (Join-Path $sourceDir "property_packages.toml"))) {
            throw "property_packages.toml not found in packaged worker payload."
          }
          if (Test-Path (Join-Path $sourceDir "dwsim.config.json")) {
            throw "dwsim.config.json must not be included in the packaged worker payload."
          }

          New-Item -ItemType Directory -Path $zipDir -Force | Out-Null
          if (Test-Path $zipPath) { Remove-Item $zipPath -Force }
          Compress-Archive -Path (Join-Path $sourceDir "*") -DestinationPath $zipPath -CompressionLevel Optimal
      - name: Install build tooling
        working-directory: mcp_service/server
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
      - name: Build wheel
        working-directory: mcp_service/server
        run: python -m build --wheel
      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: python-wheel
          path: mcp_service/server/dist/*.whl
      - name: Upload standalone DwsimWorker zip
        uses: actions/upload-artifact@v4
        with:
          name: dwsimworker-zip
          path: mcp_service/server/dist/DwsimWorker-*.zip

  publish-pypi:
    name: Publish (PyPI)
    runs-on: ubuntu-latest
    needs: build-python
    if: needs.build-python.outputs.tag-valid == 'true'
    steps:
      - name: Download wheel
        uses: actions/download-artifact@v4
        with:
          name: python-wheel
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: dist

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [publish-pypi, build-python]
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download wheel
        uses: actions/download-artifact@v4
        with:
          name: python-wheel
          path: dist
      - name: Download standalone DwsimWorker zip
        uses: actions/download-artifact@v4
        with:
          name: dwsimworker-zip
          path: dist
      - name: Create source zip
        run: |
          git archive --format=zip --output "dist/dwsim-mcp-server-${{ needs.build-python.outputs.version }}-source.zip" HEAD
      - name: Prepare release notes
        shell: bash
        run: |
          dwsim_release_url="${DWSIM_BINARIES_URL%/dwsim_binaries.zip}"
          dwsim_version="${dwsim_release_url##*/}"
          wheel_file="$(basename dist/*.whl)"
          source_file="dwsim-mcp-server-${{ needs.build-python.outputs.version }}-source.zip"
          worker_zip="DwsimWorker-${{ needs.build-python.outputs.version }}.zip"
          release_base_url="${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}"
          setup_url="${{ github.server_url }}/${{ github.repository }}/blob/${{ github.ref_name }}/mcp_service/dwsim_worker/SETUP.md"

          cat <<EOF > release-notes.md
          ## DWSIM MCP Server ${{ needs.build-python.outputs.version }}

          ### Compatibility
          | Component | Version | Notes |
          | --- | --- | --- |
          | DWSIM MCP Server | `${{ needs.build-python.outputs.version }}` | Published from tag `${{ github.ref_name }}` |
          | Compatible DWSIM build | [`${dwsim_version}`](${dwsim_release_url}) | Linked from `DWSIM_BINARIES_URL` |

          ### Assets
          - [`${wheel_file}`](${release_base_url}/${wheel_file}) - Python wheel with the prebuilt DwsimWorker payload bundled inside.
          - [`${source_file}`](${release_base_url}/${source_file}) - Source archive for this tag.
          - [`${worker_zip}`](${release_base_url}/${worker_zip}) - Standalone filtered worker binaries, including `property_packages.toml`.

          ### How to install
          - End users: follow [Installing from a release](${setup_url}#installing-from-a-release).
          - Contributors: follow [Building from source](${setup_url}#building-from-source).
          EOF
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            dist/*.whl
            dist/*-source.zip
            dist/DwsimWorker-*.zip
