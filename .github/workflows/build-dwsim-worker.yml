name: Build DwsimWorker asset

on:
  push:
    tags:
      - "v*-beta"

jobs:
  build-and-release:
    name: Build and release DwsimWorker
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up DWSIM build environment
        uses: ./.github/actions/setup-dwsim

      - name: Build
        working-directory: mcp_service/dwsim_worker
        shell: cmd
        run: build.bat

      - name: Package DwsimWorker.zip
        shell: pwsh
        run: |
          $workerOutputDir = "mcp_service/dwsim_worker/DwsimWorker/bin/Debug"
          $zipPath = "DwsimWorker.zip"
          $filesToPackage = @(
            (Join-Path $workerOutputDir "DwsimWorker.dll"),
            (Join-Path $workerOutputDir "DwsimWorker.dll.config"),
            (Join-Path $workerOutputDir "DwsimWorker.xml")
          )

          foreach ($file in $filesToPackage) {
            if (-not (Test-Path $file)) {
              throw "Required build output not found: $file"
            }
          }

          if (Test-Path $zipPath) {
            Remove-Item $zipPath -Force
          }

          Compress-Archive -Path $filesToPackage -DestinationPath $zipPath

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body: Prebuilt DwsimWorker.dll for Route B beta testers. See DIS-28.
          files: DwsimWorker.zip
          prerelease: true
